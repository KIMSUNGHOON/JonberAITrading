[pytest]
# Pytest configuration for Agentic Trading Backend

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Import mode (2026-08-12)
#
# 기본 `prepend` 모드는 `__init__.py`가 없는 디렉터리의 테스트 파일을
# **top-level 모듈명**으로 import한다. 그래서 basename이 같은 파일이 두
# 곳에 있으면 수집 자체가 죽는다:
#
#   tests/services/test_risk_monitor_alert_dedup.py                   (b611787, 07-15)
#   tests/test_services/test_trading/test_risk_monitor_alert_dedup.py (8d1fbd9, 07-20)
#   → "import file mismatch ... Interrupted: 1 error during collection"
#
# 둘 다 커밋된 실제 파일이고 내용이 다르다(구 4건 / 신 7건). `__pycache__`를
# 지워도 재발한다 -- 캐시가 아니라 구조 문제다. `importlib` 모드는 파일
# 경로로 모듈을 만들어 basename 충돌이 없고, pytest가 이런 레이아웃에
# 권장하는 방식이다. 파일을 옮기거나 지우지 않으므로 커버리지가 줄지 않는다.
#
# ⚠️ 이 충돌은 전체 스위트를 **되기도 하고 안 되기도** 만들었다. 기준선을
# "21 failed"로 알고 있다가 collection error를 만나면 자기 변경 탓으로
# 오판하기 쉽다 -- 2026-08-12에 실제로 그럴 뻔했다.
#
# 백로그: 구 4건(`tests/services/`)은 신 7건이 사실상 포함한다. 유일한 고유
# 케이스는 `test_alert_history_records_every_call_regardless_of_dedup`이다.
# 흡수 후 구 파일 제거가 근본 정리지만, import 수정과 테스트 삭제를 한
# 커밋에 섞지 않으려고 분리했다.
# ⚠️ `import-mode`는 ini 키가 아니라 **CLI 옵션**이다. ini에 그대로 쓰면
# `PytestConfigWarning: Unknown config option`만 뜨고 조용히 무시된다 --
# 2026-08-12에 실제로 그렇게 썼다가 아무 효과가 없었다. `addopts`에 넣는다.

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --timeout=60
    --import-mode=importlib
    --cov=app --cov=agents --cov=services --cov-report=term-missing

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

# Logging
log_cli = true
log_cli_level = WARNING

# Coverage (when using pytest-cov)
# addopts = --cov=app --cov=agents --cov=services --cov-report=term-missing
